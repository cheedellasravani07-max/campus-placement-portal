<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="student-signup.css">
</head>

<body>

<div class="signup-container">

    <div class="signup-card">

        <h1>Student Sign Up</h1>

        <p class="subtitle">
            Create your Campus Placement Portal account
        </p>

        <form id="signupForm">

            <!-- NAME -->
            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Email</label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
            </div>

            <!-- USERNAME -->
            <div class="form-group">
                <label for="username">Username</label>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Create a username"
                        required>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label for="password">Password</label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required>
            </div>

            <!-- BRANCH -->
            <div class="form-group">
                <label for="branch">Branch</label>

                <select id="branch" name="branch" required>

                    <option value="">
                        Select your branch
                    </option>

                    <option value="CSE">
                        CSE
                    </option>

                    <option value="IT">
                        IT
                    </option>

                    <option value="ECE">
                        ECE
                    </option>

                    <option value="EEE">
                        EEE
                    </option>

                    <option value="CIVIL">
                        CIVIL
                    </option>

                    <option value="MECH">
                        MECH
                    </option>

                </select>
            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <p class="login-link">
            Already have an account?
            <a href="/login.html">Login</a>
        </p>

    </div>

</div>

<script src="student-signup.js"></script>

</body>
</html>
