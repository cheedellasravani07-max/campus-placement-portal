<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .forgot-container {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }

    </style>

</head>

<body>

<div class="forgot-container">

    <h1>Campus Placement Portal</h1>

    <h2>Forgot Password</h2>

    <p>Enter your registered email address.</p>

    <form id="forgotPasswordForm">

        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
        >

        <button type="submit">
            Verify Email
        </button>

    </form>

    <p id="message"></p>

    <a
            href="/login.html"
            class="back-link">
        Back to Login
    </a>

</div>

<script src="forgot-password.js"></script>

</body>

</html>
