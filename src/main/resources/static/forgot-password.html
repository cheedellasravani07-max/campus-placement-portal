<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Campus Placement Portal</title>

    <style>
        :root {
            --primary: #17365d;
            --primary-dark: #102a47;
            --primary-light: #eaf1f8;

            --text-dark: #172b3f;
            --text-medium: #536273;
            --text-light: #7a8794;

            --background: #f5f7fa;
            --white: #ffffff;
            --border: #e2e7ed;

            --shadow: 0 4px 18px rgba(23, 54, 93, 0.08);
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            font-family: "Segoe UI", Arial, sans-serif;

            background: var(--background);
            color: var(--text-dark);
        }


        /* ================= TOP BAR ================= */

        .topbar {
            background: var(--white);
            border-bottom: 1px solid var(--border);

            padding: 16px 40px;
        }


        .brand-section {
            max-width: 1000px;
            margin: 0 auto;

            display: flex;
            align-items: center;
            gap: 14px;
        }


        .brand-mark {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--primary);
            color: var(--white);

            border-radius: 6px;

            font-size: 16px;
            font-weight: 700;
        }


        .brand-section h1 {
            color: var(--primary);

            font-size: 19px;
            font-weight: 650;
        }


        .brand-section p {
            margin-top: 2px;

            color: var(--text-light);

            font-size: 13px;
        }


        /* ================= MAIN ================= */

        .page-container {
            width: min(100% - 40px, 520px);

            margin: 0 auto;

            padding: 55px 0;

            flex: 1;

            display: flex;
            align-items: center;
        }


        .forgot-card {
            width: 100%;

            background: var(--white);

            border: 1px solid var(--border);
            border-radius: 8px;

            box-shadow: var(--shadow);

            overflow: hidden;
        }


        /* ================= HEADER ================= */

        .card-header {
            padding: 28px 30px;

            border-bottom: 1px solid var(--border);
        }


        .breadcrumb {
            margin-bottom: 9px;

            color: var(--text-light);

            font-size: 13px;
        }


        .card-header h2 {
            color: var(--text-dark);

            font-size: 25px;
            font-weight: 650;
        }


        .card-header p {
            margin-top: 7px;

            color: var(--text-medium);

            font-size: 14px;
            line-height: 1.5;
        }


        /* ================= FORM ================= */

        .form-section {
            padding: 28px 30px;
        }


        .form-section label {
            display: block;

            margin-bottom: 8px;

            color: var(--text-dark);

            font-size: 14px;
            font-weight: 600;
        }


        .form-section input {
            width: 100%;
            height: 44px;

            padding: 0 13px;

            border: 1px solid var(--border);
            border-radius: 5px;

            outline: none;

            background: var(--white);
            color: var(--text-dark);

            font-family: inherit;
            font-size: 14px;

            transition:
                    border-color 0.15s ease,
                    box-shadow 0.15s ease;
        }


        .form-section input::placeholder {
            color: #9aa5b1;
        }


        .form-section input:focus {
            border-color: var(--primary);

            box-shadow:
                    0 0 0 3px rgba(23, 54, 93, 0.08);
        }


        .form-section button {
            width: 100%;

            height: 44px;

            margin-top: 18px;

            border: 1px solid var(--primary);
            border-radius: 5px;

            background: var(--primary);
            color: var(--white);

            font-family: inherit;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                    background 0.15s ease,
                    border-color 0.15s ease;
        }


        .form-section button:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }


        /* ================= MESSAGE ================= */

        #message {
            min-height: 20px;

            margin-top: 16px;

            font-size: 13px;
            font-weight: 600;

            line-height: 1.5;
        }


        /* ================= FOOTER ACTION ================= */

        .card-footer {
            padding: 18px 30px;

            background: #fafbfd;

            border-top: 1px solid var(--border);

            text-align: center;
        }


        .back-link {
            color: var(--primary);

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;
        }


        .back-link:hover {
            text-decoration: underline;
        }


        /* ================= PAGE FOOTER ================= */

        .footer {
            padding: 18px 20px;

            background: var(--white);

            border-top: 1px solid var(--border);

            text-align: center;

            color: var(--text-light);

            font-size: 12px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            .topbar {
                padding: 14px 20px;
            }


            .page-container {
                width: min(100% - 28px, 520px);

                padding: 35px 0;
            }


            .card-header {
                padding: 23px 22px;
            }


            .card-header h2 {
                font-size: 23px;
            }


            .form-section {
                padding: 24px 22px;
            }


            .card-footer {
                padding: 17px 22px;
            }

        }


        @media (max-width: 420px) {

            .topbar {
                padding: 13px 15px;
            }


            .brand-mark {
                width: 38px;
                height: 38px;
            }


            .brand-section h1 {
                font-size: 15px;
            }


            .brand-section p {
                font-size: 12px;
            }


            .page-container {
                width: min(100% - 20px, 520px);
            }

        }
    </style>

</head>

<body>


<header class="topbar">

    <div class="brand-section">

        <div class="brand-mark">
            CP
        </div>

        <div>
            <h1>Campus Placement Portal</h1>
            <p>Account Recovery</p>
        </div>

    </div>

</header>


<main class="page-container">

    <section class="forgot-card">

        <div class="card-header">

            <p class="breadcrumb">
                Account / Password Recovery
            </p>

            <h2>Forgot Password</h2>

            <p>
                Enter your registered email address to verify your account
                and continue with password recovery.
            </p>

        </div>


        <div class="form-section">

            <form id="forgotPasswordForm">

                <label for="email">
                    Registered Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                >


                <button type="submit">
                    Verify Email
                </button>

            </form>


            <p id="message"></p>

        </div>


        <div class="card-footer">

            <a
                    href="/login.html"
                    class="back-link"
            >
                ← Back to Login
            </a>

        </div>

    </section>

</main>


<footer class="footer">

    <p>
        © 2026 Campus Placement Portal. All rights reserved.
    </p>

</footer>


<script src="forgot-password.js"></script>

</body>

</html>
