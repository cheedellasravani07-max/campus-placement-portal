<!-- ================= RESUME ================= -->

<section class="resume-card">

    <div class="section-header">

        <div>

            <span class="section-label">
                PLACEMENT DOCUMENT
            </span>

            <h3>
                My Resume
            </h3>

        </div>

    </div>


    <div class="resume-content">

        <div class="resume-information">

            <div class="resume-icon">
                PDF
            </div>

            <div>

                <h4>
                    Resume
                </h4>

                <p id="resumeName">
                    Checking your resume...
                </p>

            </div>

        </div>


        <div class="resume-upload">

            <label for="resumeFile">
                Select PDF
            </label>

            <input
                    type="file"
                    id="resumeFile"
                    accept="application/pdf,.pdf"
            >

            <button
                    type="button"
                    class="upload-resume-btn"
                    onclick="uploadResume()">

                Upload Resume

            </button>

        </div>


        <div class="resume-actions">

            <button
                    type="button"
                    id="viewResumeButton"
                    onclick="viewResume()"
                    style="display:none;">

                View

            </button>


            <button
                    type="button"
                    id="downloadResumeButton"
                    onclick="downloadResume()"
                    style="display:none;">

                Download

            </button>


            <button
                    type="button"
                    id="deleteResumeButton"
                    onclick="deleteResume()"
                    style="display:none;">

                Delete

            </button>

        </div>

    </div>

</section>
