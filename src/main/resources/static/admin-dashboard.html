<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="admin-dashboard.css">
</head>

<body>

<div class="admin-container">

    <h1>Campus Placement Portal</h1>

    <h2>Admin Dashboard</h2>

    <p>Welcome, Admin!</p>


    <!-- ================= BASIC STATISTICS ================= -->

    <div class="dashboard-container">

        <div class="dashboard-card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Total Companies</h3>
            <p id="totalCompanies">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Total Jobs</h3>
            <p id="totalJobs">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Total Applications</h3>
            <p id="totalApplications">0</p>
        </div>

    </div>


    <!-- ================= APPLICATION STATISTICS ================= -->

    <div class="statistics-section">

        <h2>Application Statistics</h2>

        <div class="status-container">

            <!-- APPLIED -->

            <div class="status-card">

                <h3>Applied</h3>

                <p id="appliedCount">
                    0
                </p>

            </div>


            <!-- SHORTLISTED -->

            <div class="status-card">

                <h3>Shortlisted</h3>

                <p id="shortlistedCount">
                    0
                </p>

            </div>


            <!-- INTERVIEW -->

            <div class="status-card">

                <h3>Interview</h3>

                <p id="interviewCount">
                    0
                </p>

            </div>


            <!-- ACCEPTED -->

            <div class="status-card">

                <h3>Accepted</h3>

                <p id="acceptedCount">
                    0
                </p>

            </div>


            <!-- REJECTED -->

            <div class="status-card">

                <h3>Rejected</h3>

                <p id="rejectedCount">
                    0
                </p>

            </div>

        </div>

    </div>


    <br>


    <!-- ================= ADMIN BUTTONS ================= -->

    <button onclick="openPortal()">
        Manage Placement Portal
    </button>

    <button onclick="manageApplications()">
        Manage Applications
    </button>

    <button onclick="changePasswordPage()">
        Change Password
    </button>

    <button onclick="logout()">
        Logout
    </button>

</div>


<script src="admin-dashboard.js"></script>

</body>

</html>
