<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Campus Placement Portal</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-container">

    <h1>Campus Placement Portal</h1>


    <!-- ================= LOGIN ================= -->

    <h2>Login</h2>

    <form action="/login" method="post">

        <label for="login-username">
            Username
        </label>

        <input
                type="text"
                id="login-username"
                name="username"
                placeholder="Enter username"
                required
        >

        <label for="login-password">
            Password
        </label>

        <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter password"
                required
        >

        <button type="submit">
            Login
        </button>

    </form>


    <!-- ================= SIGN UP ================= -->

    <hr>

    <h2>Student Sign Up</h2>

    <form id="signupForm">

        <label for="name">
            Name
        </label>

        <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
        >


        <label for="username">
            Username
        </label>

        <input
                type="text"
                id="username"
                name="username"
                placeholder="Create username"
                required
        >


        <label for="email">
            Email
        </label>

        <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required
        >


        <label for="password">
            Password
        </label>

        <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password"
                required
        >


        <label for="branch">
            Branch
        </label>

        <input
                type="text"
                id="branch"
                name="branch"
                placeholder="Example: IT"
                required
        >


        <button type="submit">
            Student Sign Up
        </button>

    </form>


    <!-- Registration message -->

    <p id="message"></p>

</div>


<!-- Login JavaScript -->
<script src="login.js"></script>

<!-- Student Registration JavaScript -->
<script src="student-signup.js"></script>

</body>

</html>
